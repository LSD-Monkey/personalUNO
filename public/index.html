<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNO // NIGHT SHIFT</title><link rel="stylesheet" href="/style.css"></head><body><main><header><span class="brand">UNO<span>//</span>ONLINE</span><span id="roomBadge"></span></header><section id="start" class="screen active"><div class="hero"><p class="eyebrow">MULTIPLAYER TABLE</p><h1>Shuffle.<br><em>Play loud.</em></h1><input id="name" placeholder="Dein Name" maxlength="24"><div class="split"><button id="create">RAUM ERSTELLEN</button><div class="join"><input id="code" placeholder="RAUMCODE"><button id="join">BEITRETEN</button></div></div><p id="error" class="error"></p></div></section><section id="lobby" class="screen"><div class="panel"><p class="eyebrow">LOBBY / <span id="lobbyCode"></span></p><h2>Wer sitzt am Tisch?</h2><div id="players"></div><label class="toggle"><input type="checkbox" id="stacking"> Stapel-Hausregel <span></span></label><button id="startGame">SPIEL STARTEN</button><p class="muted" id="share"></p></div></section><section id="game" class="screen"><div class="table"><div id="opponents" class="opponents"></div><div class="pile"><div id="draw" class="deck" title="Karte ziehen">+<small>DRAW</small></div><div id="top"></div><div id="turn"></div></div><div class="controls"><button id="uno">UNO!</button><button id="pass">PASS</button></div><div id="hand" class="hand"></div></div><aside class="chat"><h3>CHAT <span>LIVE</span></h3><div id="messages"></div><form id="chatForm"><input id="chatInput" placeholder="Nachricht..."><button>↗</button></form></aside></section><section id="round" class="screen"><div class="panel"><p class="eyebrow">ROUND COMPLETE</p><h2 id="winner"></h2><div id="scores"></div><button id="newRound">NEUE RUNDE</button></div></section></main><div id="colors" class="modal"><div><h3>FARBE WÄHLEN</h3><button data-color="red">ROT</button><button data-color="yellow">GELB</button><button data-color="green">GRÜN</button><button data-color="blue">BLAU</button></div></div><script src="/socket.io/socket.io.js"></script><script src="/cardRenderer.js"></script><script src="/ui.js"></script><script src="/client.js"></script></body></html>
